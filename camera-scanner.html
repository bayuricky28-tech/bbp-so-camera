<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera QR Scanner - Stock Opname</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      background-color: #f4f5f6;
      color: #1d2d3e;
      font-family: "72", Arial, Helvetica, sans-serif;
    }
    .fiori-card {
      background: #ffffff;
      border: 1px solid #c8d1dc;
      border-radius: 2px;
    }
    .fiori-header {
      background: linear-gradient(180deg, #eef2f6 0%, #e1e7ee 100%);
      border-bottom: 1px solid #c8d1dc;
    }
    .btn-fiori-primary {
      background-color: #0a6ed1;
      color: #ffffff;
      border: 1px solid #0854a0;
      border-radius: 2px;
    }
    .btn-fiori-primary:hover { background-color: #0854a0; }
    .btn-fiori-secondary {
      background-color: #ffffff;
      color: #0a6ed1;
      border: 1px solid #0a6ed1;
      border-radius: 2px;
    }
    .btn-fiori-secondary:hover { background-color: #ebf5fe; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div class="p-2.5 max-w-xl w-full mx-auto flex flex-col gap-2.5 flex-1">
    <div class="fiori-card overflow-hidden">
      <div class="fiori-header px-3.5 py-2 flex items-center justify-between gap-2">
        <div>
          <div class="text-[10px] font-bold uppercase tracking-wider text-slate-600">Live Camera Scanner • Stock Opname</div>
          <h1 class="text-xs font-bold text-[#1d2d3e]">Pemindai QR Kamera</h1>
        </div>
        <button type="button" onclick="goBackToInputApp()" class="btn-fiori-secondary text-xs font-semibold px-2.5 py-1">
          Kembali / Tutup
        </button>
      </div>

      <div class="p-3 space-y-2.5">
        <div id="statusBox" class="bg-[#e3f0fc] border border-[#8eb8e0] text-[#0854a0] text-xs font-semibold px-3 py-2 rounded-sm">
          Menyiapkan akses kamera...
        </div>

        <div class="bg-[#1d2d3e] border border-[#c8d1dc] rounded-sm overflow-hidden">
          <div id="qr-reader" class="w-full min-h-[260px]"></div>
        </div>

        <div class="bg-[#f4f6f9] border border-[#c8d1dc] px-3 py-2 rounded-sm flex flex-wrap items-center justify-between gap-2 text-xs">
          <div>
            <span class="text-slate-600 font-semibold">Hasil Scan Terakhir:</span>
            <span id="lastScannedText" class="font-mono font-bold text-[#0a6ed1] ml-1">-</span>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" id="btnSwitchCam" onclick="switchCamera()" class="btn-fiori-secondary px-2.5 py-1 font-semibold">
              Ganti Kamera
            </button>
            <button type="button" onclick="resumeScanning()" class="btn-fiori-primary px-3 py-1 font-semibold">
              Scan Lagi
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TARGET_APP_ORIGIN = "*";
    const SCAN_COOLDOWN_MS = 1500;
    const AUTO_RETURN_DELAY_MS = 600;

    const urlParams = new URLSearchParams(window.location.search);
    const returnAppUrl = urlParams.get("appUrl") || "";
    const isEmbedded = urlParams.get("embedded") === "1";

    let html5QrCode = null;
    let availableCameras = [];
    let currentCameraIndex = 0;
    let isPausedForCooldown = false;
    let isReturningToApp = false;
    let lastCode = "";
    let lastScanTime = 0;
    const channel = ("BroadcastChannel" in window) ? new BroadcastChannel("bbp_so_camera_channel") : null;

    function setStatus(msg, isError) {
      const box = document.getElementById("statusBox");
      box.innerText = msg;
      box.className = isError
        ? "bg-red-50 border border-red-300 text-red-800 text-xs font-semibold px-3 py-2 rounded-sm"
        : "bg-[#e3f0fc] border border-[#8eb8e0] text-[#0854a0] text-xs font-semibold px-3 py-2 rounded-sm";
    }

    function goBackToInputApp() {
      if (isReturningToApp) return;
      isReturningToApp = true;

      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().catch(() => {});
      }

      if (!isEmbedded && window.opener && !window.opener.closed) {
        try { window.opener.focus(); } catch (err) {}
        try { window.close(); return; } catch (err) {}
      }

      if (!isEmbedded && returnAppUrl) {
        window.location.href = returnAppUrl;
      } else if (!isEmbedded && window.history.length > 1) {
        window.history.back();
      }
    }

    function sendScanToOpnameApp(decodedText) {
      const cleanCode = String(decodedText || "").trim().toUpperCase();
      if (!cleanCode) return;

      const now = Date.now();
      if (cleanCode === lastCode && (now - lastScanTime) < SCAN_COOLDOWN_MS) return;
      lastCode = cleanCode;
      lastScanTime = now;

      document.getElementById("lastScannedText").innerText = cleanCode;
      const payload = {
        type: "BBP_SO_QR_SCANNED",
        qrCode: cleanCode,
        timestamp: now
      };

      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage(payload, TARGET_APP_ORIGIN); } catch (err) {}
      }
      if (window.opener && !window.opener.closed) {
        try { window.opener.postMessage(payload, TARGET_APP_ORIGIN); } catch (err) {}
      }
      if (channel) {
        channel.postMessage(payload);
      }
      localStorage.setItem("bbp_so_last_camera_scan", JSON.stringify(payload));

      setStatus(`QR [${cleanCode}] terbaca. Memproses ke menu input data...`, false);
      if (!isEmbedded) {
        setTimeout(goBackToInputApp, AUTO_RETURN_DELAY_MS);
      }
    }

    function onScanSuccess(decodedText) {
      if (isPausedForCooldown || isReturningToApp) return;
      isPausedForCooldown = true;
      sendScanToOpnameApp(decodedText);
      setTimeout(() => { isPausedForCooldown = false; }, SCAN_COOLDOWN_MS);
    }

    async function startCameraByIndex(index) {
      if (!html5QrCode) html5QrCode = new Html5Qrcode("qr-reader");
      if (html5QrCode.isScanning) await html5QrCode.stop();
      const config = { fps: 12, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 };
      const cam = availableCameras.length > 0 ? availableCameras[index].id : { facingMode: "environment" };
      await html5QrCode.start(cam, config, onScanSuccess, () => {});
      setStatus("Kamera aktif. Arahkan QR Code stiker ke dalam bingkai.", false);
    }

    async function initCameraScanner() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Browser tidak mendukung akses kamera atau halaman tidak dibuka lewat HTTPS.");
        }
        availableCameras = (await Html5Qrcode.getCameras()) || [];
        if (availableCameras.length > 1) {
          const backIdx = availableCameras.findIndex(d => /back|rear|environment|belakang/i.test(d.label));
          currentCameraIndex = backIdx >= 0 ? backIdx : 0;
        } else {
          currentCameraIndex = 0;
        }
        await startCameraByIndex(currentCameraIndex);
      } catch (err) {
        setStatus("Gagal membuka kamera: " + (err.message || err), true);
      }
    }

    async function switchCamera() {
      if (availableCameras.length <= 1) return setStatus("Hanya terdeteksi satu kamera.", false);
      currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
      try { await startCameraByIndex(currentCameraIndex); } catch (err) {
        setStatus("Gagal mengganti kamera: " + (err.message || err), true);
      }
    }

    function resumeScanning() {
      lastCode = "";
      isPausedForCooldown = false;
      isReturningToApp = false;
      setStatus("Siap memindai QR Code berikutnya.", false);
    }

    window.addEventListener("DOMContentLoaded", initCameraScanner);
    window.addEventListener("beforeunload", () => {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().catch(() => {});
      }
    });
  </script>
</body>
</html>
